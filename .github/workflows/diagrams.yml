name: diagrams

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every ```mermaid block parsed with Mermaid's own parser (check_mermaid.mjs),
  # so a diagram that would render as "Syntax error in text" fails the PR.
  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install mermaid and jsdom from the lock file
        run: npm ci --no-audit --no-fund
      - name: Parse every Mermaid diagram
        run: node check_mermaid.mjs
